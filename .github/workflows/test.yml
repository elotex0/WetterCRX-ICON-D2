name: Test ICON-D2 GRIB2 Download

on:
  workflow_dispatch:

jobs:
  fetch_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set RUN and DATE
        run: |
          HOUR=$(date -u +%H)

          case "$HOUR" in
            00|01|02|03) RUN=00 ;;
            04|05|06) RUN=03 ;;
            07|08|09) RUN=06 ;;
            10|11|12) RUN=09 ;;
            13|14|15) RUN=12 ;;
            16|17|18) RUN=15 ;;
            19|20|21) RUN=18 ;;
            22|23) RUN=21 ;;
          esac

          DATE=$(date -u +%Y%m%d)

          echo "RUN=$RUN" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Download and test ICON grid
        run: |
          set -e
          mkdir -p data/grid

          wget -q https://github.com/elotex0/WetterCRX-ICON-D2/releases/download/v.1.0/clat.grib2 \
            -O data/grid/clat.grib2

          wget -q https://github.com/elotex0/WetterCRX-ICON-D2/releases/download/v.1.0/clon.grib2 \
            -O data/grid/clon.grib2

          test -s data/grid/clat.grib2
          test -s data/grid/clon.grib2

      - name: Download and test T2M GRIB2 files
        run: |
          set +e
          mkdir -p data/t2m
          export DOWNLOAD_OK=0
          export DOWNLOAD_FAILED=0

          for i in $(seq 0 47); do
            i_padded=$(printf "%03d" "$i")

            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/T_2M/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2.bz2"

            if wget -q -O "data/t2m/t2m_${i_padded}.grib2.bz2" "$URL"; then
              if [ -s "data/t2m/t2m_${i_padded}.grib2.bz2" ]; then
                DOWNLOAD_OK=$((DOWNLOAD_OK + 1))
              else
                DOWNLOAD_FAILED=$((DOWNLOAD_FAILED + 1))
                rm -f "data/t2m/t2m_${i_padded}.grib2.bz2"
              fi
            else
              DOWNLOAD_FAILED=$((DOWNLOAD_FAILED + 1))
              rm -f "data/t2m/t2m_${i_padded}.grib2.bz2"
            fi
          done

          echo "DOWNLOAD_OK=$DOWNLOAD_OK" >> "$GITHUB_ENV"
          echo "DOWNLOAD_FAILED=$DOWNLOAD_FAILED" >> "$GITHUB_ENV"

      - name: Final test result
        if: always()
        run: |
          if [ -s data/grid/clat.grib2 ] &&
             [ -s data/grid/clon.grib2 ] &&
             [ "${DOWNLOAD_OK:-0}" -gt 0 ]; then
            echo "TEST ERFOLGREICH"
          else
            echo "TEST FEHLGESCHLAGEN"
            exit 1
          fi